[package]
name = "fetchman"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "Reliable downloads, without the configuration homework"
license = "MIT"

[dependencies]
blake3 = { version = "1.8", features = ["pure"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
httpdate = "1"
percent-encoding = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
lto = "thin"
strip = true
